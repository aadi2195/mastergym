<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) | The Glorious Gym / CROSSFIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #070808;
      color: #F7F8F5;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
    }
    .badge {
      background: #D7FF35;
      color: #070808;
      font-family: 'Oswald', sans-serif;
      font-weight: 800;
      font-size: 1.8rem;
      width: 50px; height: 50px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px;
      margin-bottom: 20px;
      transform: skew(-6deg);
    }
    .code {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(6rem, 15vw, 10rem);
      font-weight: 700;
      color: #D7FF35;
      line-height: 0.9;
      margin-bottom: 10px;
      text-shadow: 0 0 35px rgba(215, 255, 53, 0.4);
    }
    h1 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      text-transform: uppercase;
      margin-bottom: 15px;
    }
    p {
      color: #A6AAA6;
      max-width: 480px;
      font-size: 1rem;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: #D7FF35;
      color: #070808;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    .btn:hover { background: #c4ec29; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="badge">G</div>
  <div class="code">404</div>
  <h1>PAGE NOT FOUND</h1>
  <p>The workout or page you are looking for does not exist. Let's get you back to the training floor.</p>
  <a href="./" class="btn"><i class="fa-solid fa-house"></i> BACK TO HOME</a>
</body>
</html>
